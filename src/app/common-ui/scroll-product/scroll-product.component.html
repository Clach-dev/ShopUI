<div class="scroll-product"
     (mouseenter)="handleMouseEnter()"
     (mouseleave)="handleMouseLeave()">
  <div class="product-container">
    <div class="product active">
      <div class="product-info">
        <h1>Название товара 1</h1>
        <p>14 499,99 ₽</p>
        <button class="buy-button">В корзину</button>
      </div>
      <img src="/banana.png" alt="Product Image">
    </div>

    <div class="product">
      <div class="product-info">
        <h1>Название товара 2</h1>
        <p>12 999,99 ₽</p>
        <button class="buy-button">В корзину</button>
      </div>
      <img src="/banana.png" alt="Product Image">
    </div>

    <div class="product">
      <div class="product-info">
        <h1>Название товара 3</h1>
        <p>15 999,99 ₽</p>
        <button class="buy-button">В корзину</button>
      </div>
      <img src="/banana.png" alt="Product Image">
    </div>
  </div>

  <!-- Кнопки навигации -->
  <button class="nav-button left" (click)="prevSlide()">&#10094;</button>
  <button class="nav-button right" (click)="nextSlide()">&#10095;</button>

  <!-- Индикаторы -->
  <div class="indicators">
    <span [class.active]="currentSlide === 0" (click)="goToSlide(0)"></span>
    <span [class.active]="currentSlide === 1" (click)="goToSlide(1)"></span>
    <span [class.active]="currentSlide === 2" (click)="goToSlide(2)"></span>
  </div>
</div>
