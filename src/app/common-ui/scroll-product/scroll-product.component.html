<div class="scroll-product"
     (mouseenter)="handleMouseEnter()"
     (mouseleave)="handleMouseLeave()">
  <div class="product-container">
    <div *ngFor="let product of products; let i = index"
         class="product"
         [class.active]="i === currentSlide">
      <div class="product-info">
        <h1>{{ product.name }}</h1>
        <p>{{ product.price }}</p>
        <button class="buy-button">В корзину</button>
      </div>
      <img [src]="product.imageUrl" alt="{{ product.name }}">
    </div>
  </div>

  <button class="nav-button left" (click)="prevSlide()">&#10094;</button>
  <button class="nav-button right" (click)="nextSlide()">&#10095;</button>

  <div class="indicators">
    <span *ngFor="let product of products; let i = index"
          [class.active]="i === currentSlide"
          (click)="goToSlide(i)"></span>
  </div>
</div>
